[project]
name = "lockbox"
version = "0.1.0"
description = "Passwordless access to 1Password secrets for your scripts, unlocked once per session."
license = "Apache-2.0"
authors = [{ name = "Peter Sutton", email = "peter@petersutton.dev" }]
requires-python = ">= 3.14"
dependencies = [
  "anyio",
  "onepassword-sdk",
  "pydantic",
  "ruamel.yaml",
  "suppress-unhandled",
]

[project.scripts]
lockbox = "lockbox.__main__:main"

[dependency-groups]
dev = ["cleek"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
